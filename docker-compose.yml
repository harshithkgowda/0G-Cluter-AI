version: '3.8'

services:
  ai-ppt-generator:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./public:/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/zerog-storage"]
      interval: 30s
      timeout: 10s
      retries: 3
